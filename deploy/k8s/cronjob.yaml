apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoipupdate
  labels:
    app.kubernetes.io/name: geoipupdate
spec:
  # Daily. MaxMind publishes twice a week; a daily run catches each release
  # within a day and retries a failed day before the stale warning (7 days).
  # Odd minute so this doesn't land with every other cluster's midnight job.
  schedule: "17 6 * * *"
  # Two writers on one directory is the only way to corrupt the file.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: geoipupdate
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # Same uid as geoipcheck. fsGroup makes the volume writable on
            # drivers that honor it; most RWX drivers (NFS, EFS) don't, and
            # the volume root must be writable by 65532. See README.md.
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: geoipupdate
              image: ghcr.io/maxmind/geoipupdate:v7.1.0
              env:
                - name: GEOIPUPDATE_EDITION_IDS
                  value: GeoLite2-Country
                - name: GEOIPUPDATE_DB_DIR
                  value: /data
                # Unset frequency means run once and exit, which is what a
                # CronJob wants.
              envFrom:
                # Keys GEOIPUPDATE_ACCOUNT_ID and GEOIPUPDATE_LICENSE_KEY.
                - secretRef:
                    name: geoipupdate
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: geoip-data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: geoip-data
              persistentVolumeClaim:
                claimName: geoip-data
            - name: tmp
              emptyDir: {}
