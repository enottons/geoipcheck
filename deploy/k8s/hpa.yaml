apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geoipcheck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geoipcheck
  # Three is for availability across zones, not load.
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # The work is CPU-bound lookups in memory; CPU tracks load directly.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
