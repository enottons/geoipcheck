apiVersion: v1
kind: Service
metadata:
  name: geoipcheck
  labels:
    app.kubernetes.io/name: geoipcheck
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: geoipcheck
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
    # ClusterIP balances connections, not requests. gRPC clients hold one
    # long-lived connection; the server's 5m MaxConnectionAge rebalances it.
    # For per-call balancing see docs/operations.md.
    - name: grpc
      port: 9090
      targetPort: grpc
      appProtocol: grpc
    - name: admin
      port: 8081
      targetPort: admin
      appProtocol: http
