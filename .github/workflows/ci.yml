# Action tags are pinned to major versions for readability. Pin to commit
# SHAs before this repo takes outside contributions.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking reads the base branch from local history, which
          # also works for a private repo without extra credentials.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make tools-lint
      # golangci-lint also runs the gofmt and goimports formatters.
      - run: make lint
      - name: generated code is current
        # status, not diff: a new .proto produces untracked files.
        run: |
          make proto
          test -z "$(git status --porcelain -- api/proto)" || { git status --porcelain -- api/proto; exit 1; }
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-${{ matrix.layer }}

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzCheck -fuzztime=20s ./internal/countrycheck
      # The crashing input is the only way to reproduce a fuzz failure.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: internal/countrycheck/testdata/fuzz

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make tools-vuln
      - run: make vuln

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make tools-k8s
      - run: make k8s

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: geoipcheck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
